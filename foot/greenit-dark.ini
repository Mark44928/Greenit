# Greenit dark — foot terminal theme
# foot reads themes from ~/.config/foot/foot.ini. Drop this file in as
# foot.ini (or include it with `include=~/.config/foot/greenit-dark.ini`).
# Colors are hex without the leading '#' (INI has no comments mid-value).
[colors]
background=0C1F17
foreground=C9E4CE
cursor=C9E4CE
selection-background=122A1F
selection-foreground=C9E4CE

regular0=1A331C
regular1=A88EA0
regular2=7BD88F
regular3=B8CC7A
regular4=63C9A8
regular5=A88EA0
regular6=7FD7C4
regular7=A7C4A3
bright0=78997F
bright1=D4B4C0
bright2=9BEDAF
bright3=D4E49A
bright4=8FE4C4
bright5=D4B4C0
bright6=A7EBDC
bright7=C9E4CE
