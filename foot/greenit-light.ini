# Greenit light — foot terminal theme
# foot reads themes from ~/.config/foot/foot.ini. Drop this file in as
# foot.ini (or include it with `include=~/.config/foot/greenit-light.ini`).
# Colors are hex without the leading '#' (INI has no comments mid-value).
[colors]
background=F2F7EF
foreground=24382C
cursor=24382C
selection-background=E6EFE2
selection-foreground=24382C

regular0=E6EFE2
regular1=C07A6E
regular2=7BD88F
regular3=B8CC7A
regular4=63C9A8
regular5=A88EA0
regular6=7FD7C4
regular7=C9E4CE
bright0=56695C
bright1=E49A8E
bright2=9BEDAF
bright3=D4E49A
bright4=8FE4C4
bright5=D4B4C0
bright6=A7EBDC
bright7=FFFFFF
