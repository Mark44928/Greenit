# Greenit light — tmux theme
# Source: tmux source-file "$HOME/repos/Greenit/tmux/greenit-light.conf"
# Hex #RRGGBB colour values (tmux converts to nearest 256-colour slot).

set -g status "on"
set -g status-style "fg=#24382C,bg=#E6EFE2"
set -g window-status-style "fg=#56695C"
set -g window-status-current-style "fg=#F2F7EF,bg=#7BD88F,bold"
set -g window-status-activity-style "fg=#A88EA0,bg=#F2F7EF"
set -g window-status-bell-style "fg=#C07A6E,bg=#F2F7EF"
set -g pane-border-style "fg=#56695C"
set -g pane-active-border-style "fg=#7BD88F"
set -g message-style "fg=#24382C,bg=#E6EFE2"
set -g message-command-style "fg=#24382C,bg=#E6EFE2"
set -g mode-style "fg=#F2F7EF,bg=#7BD88F,bold"
set -g display-panes-active-colour "#7BD88F"
set -g display-panes-colour "#56695C"
set -g clock-mode-colour "#7BD88F"
set -g status-left "#[fg=#F2F7EF,bg=#7BD88F,bold] #S #[default]"
set -g status-right "#[fg=#56695C] %H:%M #[default]"
set -g status-left-length 100
set -g status-right-length 100
