# Greenit dark — tmux theme
# Source: tmux source-file "$HOME/repos/Greenit/tmux/greenit-dark.conf"
# Hex #RRGGBB colour values (tmux converts to nearest 256-colour slot).

set -g status "on"
set -g status-style "fg=#C9E4CE,bg=#122A1F"
set -g window-status-style "fg=#78997F"
set -g window-status-current-style "fg=#0C1F17,bg=#7BD88F,bold"
set -g window-status-activity-style "fg=#A88EA0,bg=#0C1F17"
set -g window-status-bell-style "fg=#C07A6E,bg=#0C1F17"
set -g pane-border-style "fg=#78997F"
set -g pane-active-border-style "fg=#7BD88F"
set -g message-style "fg=#C9E4CE,bg=#122A1F"
set -g message-command-style "fg=#C9E4CE,bg=#122A1F"
set -g mode-style "fg=#0C1F17,bg=#7BD88F,bold"
set -g display-panes-active-colour "#7BD88F"
set -g display-panes-colour "#78997F"
set -g clock-mode-colour "#7BD88F"
set -g status-left "#[fg=#0C1F17,bg=#7BD88F,bold] #S #[default]"
set -g status-right "#[fg=#78997F] %H:%M #[default]"
set -g status-left-length 100
set -g status-right-length 100
