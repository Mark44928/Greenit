    <circle cx="0" cy="-74" r="7" fill="#7BD88F" stroke="#0C1F17" stroke-width="3"/>
  </g>
  <text x="282" y="158" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="96" font-weight="700" letter-spacing="14" fill="#C9E4CE">GREENIT</text>
  <text x="285" y="212" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="21" letter-spacing="4" fill="#78997F">plug in. grow.</text>
