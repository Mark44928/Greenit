<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Greenit</title>
  <desc id="d">Greenit — terminal, editor and shell theme family. A green leaf tile with dew and veins beside the GREENIT wordmark.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102A20"/>
      <stop offset="0.55" stop-color="#0C1F17"/>
      <stop offset="1" stop-color="#091510"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#183B2B"/>
      <stop offset="1" stop-color="#0E2419"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B6F5C6"/>
      <stop offset="0.45" stop-color="#7BD88F"/>
      <stop offset="1" stop-color="#2F6B4C"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63C9A8"/>
      <stop offset="1" stop-color="#63C9A8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7BD88F" stop-opacity="0.32"/>
      <stop offset="0.65" stop-color="#7BD88F" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#7BD88F" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="28" fill="url(#card)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="27.25" fill="none" stroke="#63C9A8" stroke-opacity="0.35" stroke-width="1.5"/>

  <g transform="translate(116 50)">
    <rect width="200" height="200" rx="46" fill="url(#tile)" stroke="#63C9A8" stroke-opacity="0.28" stroke-width="1.5"/>
    <circle cx="100" cy="106" r="96" fill="url(#glow)" filter="url(#soft)"/>
    <g transform="translate(100 104)">
      <path d="M0,-64 C 46,-24 52,18 40,54 C 30,82 -30,82 -40,54 C -52,18 -46,-24 0,-64 Z"
            fill="url(#leaf)" stroke="#08130D" stroke-width="4.5" stroke-linejoin="round"/>
      <path d="M0,-44 C 7,-6 7,24 0,60" fill="none" stroke="#08130D" stroke-width="3.6" stroke-linecap="round" opacity="0.7"/>
      <path d="M0,-20 C 15,-12 23,-2 25,11" fill="none" stroke="#08130D" stroke-width="2.8" stroke-linecap="round" opacity="0.45"/>
      <path d="M0,6 C -15,14 -23,26 -25,38" fill="none" stroke="#08130D" stroke-width="2.8" stroke-linecap="round" opacity="0.45"/>
      <circle cx="0" cy="-52" r="5.5" fill="#B6F5C6" stroke="#08130D" stroke-width="2.4"/>
      <circle cx="-24" cy="34" r="6" fill="#A8E8BC" stroke="#08130D" stroke-width="2.2"/>
      <circle cx="26" cy="14" r="4.4" fill="#A8E8BC" stroke="#08130D" stroke-width="2.2"/>
      <ellipse cx="-11" cy="-26" rx="5" ry="9" transform="rotate(22 -11 -26)" fill="#FFFFFF" opacity="0.28"/>
    </g>
  </g>

  <text x="356" y="132" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="84" font-weight="800" letter-spacing="11" fill="#DEF4E5">GREENIT</text>
  <text x="358" y="174" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" letter-spacing="4.5" fill="#8FB39B">TERMINAL · EDITOR · SHELL THEMES</text>
  <line x1="358" y1="196" x2="780" y2="196" stroke="url(#edge)" stroke-width="2"/>
  <text x="358" y="230" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" letter-spacing="1.5" fill="#6F917B">dark + light · 60 artifacts from one palette.json</text>

  <g transform="translate(978 214)">
    <circle cx="0" cy="0" r="11" fill="#7BD88F"/>
    <circle cx="34" cy="0" r="11" fill="#63C9A8"/>
    <circle cx="68" cy="0" r="11" fill="#B6F5C6"/>
    <circle cx="102" cy="0" r="11" fill="#A88EA0"/>
  </g>
  <text x="978" y="248" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="3" fill="#5E7F6B">BY MARK44928</text>
</svg>
