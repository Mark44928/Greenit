  <rect width="1200" height="300" rx="26" fill="#0C1F17"/>
  <rect x="0" y="0" width="1200" height="300" rx="26" fill="none" stroke="url(#edge)" stroke-width="2.5" opacity="0.8"/>
  <g transform="translate(140 152)">
