# Greenit dark — lazygit theme
# Install: cp lazygit/greenit-dark.yml ~/.config/lazygit/greenit-dark.yml
# Load: lazygit --use-config-file ~/.config/lazygit/config.yml,~/.config/lazygit/greenit-dark.yml
# Or: LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/greenit-dark.yml" lazygit

gui:
  theme:
    activeBorderColor:
      - "#7BD88F"
      - bold
    inactiveBorderColor:
      - "#78997F"
    searchingActiveBorderColor:
      - "#63C9A8"
    optionsTextColor:
      - "#7BD88F"
    selectedLineBgColor:
      - "#122A1F"
    inactiveViewSelectedLineBgColor:
      - "#122A1F"
    cherryPickedCommitFgColor:
      - "#7BD88F"
    cherryPickedCommitBgColor:
      - "#122A1F"
    markedBaseCommitFgColor:
      - "#7BD88F"
    markedBaseCommitBgColor:
      - "#B8CC7A"
    unstagedChangesColor:
      - "#C07A6E"
    defaultFgColor:
      - "#C9E4CE"
    selectedLineFgColor:
      - "#C9E4CE"

  colorScheme: dark
