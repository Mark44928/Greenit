# Greenit light — lazygit theme
# Install: cp lazygit/greenit-light.yml ~/.config/lazygit/greenit-light.yml
# Load: lazygit --use-config-file ~/.config/lazygit/config.yml,~/.config/lazygit/greenit-light.yml
# Or: LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/greenit-light.yml" lazygit

gui:
  theme:
    activeBorderColor:
      - "#7BD88F"
      - bold
    inactiveBorderColor:
      - "#56695C"
    searchingActiveBorderColor:
      - "#63C9A8"
    optionsTextColor:
      - "#7BD88F"
    selectedLineBgColor:
      - "#E6EFE2"
    inactiveViewSelectedLineBgColor:
      - "#E6EFE2"
    cherryPickedCommitFgColor:
      - "#7BD88F"
    cherryPickedCommitBgColor:
      - "#E6EFE2"
    markedBaseCommitFgColor:
      - "#7BD88F"
    markedBaseCommitBgColor:
      - "#B8CC7A"
    unstagedChangesColor:
      - "#C07A6E"
    defaultFgColor:
      - "#24382C"
    selectedLineFgColor:
      - "#24382C"

  colorScheme: light
